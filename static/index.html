<!DOCTYPE html>
<html>
  <head>
    <title>Sviago App</title>
  </head>
  <body>
    <table>
      <tr>
        <th>Airport</th>
      </tr>
      {{range $index, $element := .IATA }}
      <tr>
        <td>
          <a href="/arrivals/{{ $element }}/">{{ $element }}</a>
        </td>
      </tr>
      {{end}}
    </table>
  </body>
</html>
